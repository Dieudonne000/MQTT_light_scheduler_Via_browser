<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Scheduler Dashboard</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        
        .container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
            padding: 40px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .container:hover {
            transform: translateY(-5px);
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        h1 {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 16px;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2c3e50;
            font-size: 15px;
        }
        
        input[type="time"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            box-sizing: border-box;
            color: #2c3e50;
            font-family: 'Poppins', sans-serif;
        }
        
        input[type="time"]:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
            font-family: 'Poppins', sans-serif;
        }
        
        button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .icon-light {
            font-size: 40px;
            margin-bottom: 10px;
            display: inline-block;
            animation: glow 2s infinite alternate;
        }
        
        @keyframes glow {
            from {
                text-shadow: 0 0 5px rgba(255, 215, 0, 0.2);
            }
            to {
                text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            }
        }
        
        .connection-status {
            margin-top: 25px;
            font-size: 14px;
            color: #7f8c8d;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            background-color: #e74c3c;
            transition: background-color 0.3s;
        }
        
        .status-indicator.connected {
            background-color: #2ecc71;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #2ecc71;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateX(200%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        
        .notification.show {
            transform: translateX(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon-light">💡</div>
            <h1>Smart Light Scheduler</h1>
            <p class="subtitle">Schedule your lights to turn on and off automatically</p>
        </div>
        
        <div class="form-group">
            <label for="onTime">Turn ON at:</label>
            <input type="time" id="onTime">
        </div>
        
        <div class="form-group">
            <label for="offTime">Turn OFF at:</label>
            <input type="time" id="offTime">
        </div>
        
        <button onclick="submitSchedule()">Save Schedule</button>
        
        <div class="connection-status">
            <div class="status-indicator" id="statusIndicator"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </div>
    
    <div class="notification" id="notification">Schedule saved successfully!</div>
    
    <script>
        let socket = new WebSocket("ws://localhost:8765");
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const notification = document.getElementById('notification');
        
        socket.onopen = () => {
            console.log("✅ WebSocket Connected!");
            statusIndicator.classList.add('connected');
            statusText.textContent = "Connected";
        };
        
        socket.onclose = () => {
            statusIndicator.classList.remove('connected');
            statusText.textContent = "Disconnected";
        };
        
        socket.onerror = () => {
            statusIndicator.classList.remove('connected');
            statusText.textContent = "Connection Error";
        };
        
        function submitSchedule() {
            const onTime = document.getElementById('onTime').value;
            const offTime = document.getElementById('offTime').value;
            
            if (onTime) {
                socket.send(`${onTime} ON`);
            }
            if (offTime) {
                socket.send(`${offTime} OFF`);
            }
            
            // Show notification
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
